function size(){const w=stage.clientWidth||innerWidth,h=stage.clientHeight||innerHeight;r.setSize(w,h);cam.aspect=w/h;cam.fov=w<h?62:50;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();go('top',true);
function loop(now){requestAnimationFrame(loop);if(anim){let k=Math.min(1,(now-anim.s)/900);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cam.position.lerpVectors(anim.p0,anim.P,k);ctl.target.lerpVectors(anim.t0,anim.T,k);if(k>=1)anim=null;}ctl.update();r.render(scene,cam);}
requestAnimationFrame(loop);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>scene.background.set(isDark()?0x1b1a18:0xe8e4de));}catch(e){}
}
</script>
